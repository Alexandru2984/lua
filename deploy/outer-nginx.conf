server {
    listen 80;
    listen [::]:80;
    server_name lua.micutu.com;

    access_log /var/log/nginx/lua-canary.access.log;
    error_log /var/log/nginx/lua-canary.error.log warn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lua.micutu.com;

    access_log /var/log/nginx/lua-canary.access.log;
    error_log /var/log/nginx/lua-canary.error.log warn;
    server_tokens off;
    client_max_body_size 16k;

    set $lua_origin_allowed $from_cloudflare_origin;
    if ($lua_origin_allowed = 0) {
        return 403;
    }

    ssl_certificate /etc/letsencrypt/live/lua.micutu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lua.micutu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:lua_canary_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;


    location = /robots.txt {
        alias /srv/canary/shared/robots.txt;
        access_log off;
        log_not_found off;
    }

    location / {
        # Private workspace: retain authentication and server-level noindex.
        auth_basic "Recon Dashboard";
        auth_basic_user_file /etc/nginx/auth/testlab.htpasswd;

        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 45s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 45s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none';" always;
}
