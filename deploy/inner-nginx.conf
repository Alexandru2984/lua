load_module /usr/lib/nginx/modules/ndk_http_module.so;
load_module /usr/lib/nginx/modules/ngx_http_lua_module.so;
worker_processes 1;
daemon off;
error_log logs/error.log warn;
pid /run/recon-dashboard-canary/nginx.pid;
worker_shutdown_timeout 45s;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    lua_package_path "$prefix/modules/?.lua;;";
    lua_shared_dict rate_limit_store 10m;
    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    lua_ssl_verify_depth 5;
    lua_ssl_protocols TLSv1.2 TLSv1.3;
    lua_socket_log_errors off;
    lua_max_pending_timers 32;
    lua_max_running_timers 16;
    init_worker_by_lua_file init.lua;
    resolver 1.1.1.1 8.8.8.8 valid=60s ipv6=off;
    resolver_timeout 2s;
    server {
        listen 127.0.0.1:8084;
        server_name lua.micutu.com localhost;
        set $app_origin https://lua.micutu.com;
        # Only the local outer Nginx is a trusted source for this header.
        set_real_ip_from 127.0.0.1;
        real_ip_header X-Real-IP;
        client_max_body_size 4k;
        client_body_buffer_size 8k;
        client_header_timeout 10s;
        client_body_timeout 10s;
        send_timeout 10s;
        keepalive_timeout 15s;
        access_log logs/access.log;
        root /srv/canary/lua.micutu.com/app/static;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.micutu.com https://static.cloudflareinsights.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://analytics.micutu.com https://cloudflareinsights.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "private, no-store" always;
        location = / { try_files /index.html =404; }
        location /assets/ {
            rewrite ^/assets/(.*)$ /$1 break;
            try_files $uri =404;
        }
        location /api/ {
            default_type application/json;
            content_by_lua_file app.lua;
        }
        location = /robots.txt { try_files /robots.txt =404; }
        location ~ /\. { return 404; }
        location / { return 404; }
    }
}
