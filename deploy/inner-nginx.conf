load_module /usr/lib/nginx/modules/ndk_http_module.so;
load_module /usr/lib/nginx/modules/ngx_http_lua_module.so;

worker_processes 1;
daemon off;

error_log /srv/canary/lua.micutu.com/app/logs/error.log;
pid /run/recon-dashboard-canary/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    lua_package_path "/srv/canary/lua.micutu.com/app/modules/?.lua;;";
    lua_shared_dict rate_limit_store 10m;

    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    server {
        listen 127.0.0.1:8084;
        server_name localhost;

        access_log /srv/canary/lua.micutu.com/app/logs/access.log;

        location / {
            default_type text/html;
            content_by_lua_file /srv/canary/lua.micutu.com/app/app.lua;
        }
    }
}
