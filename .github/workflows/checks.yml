name: Application and security checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    # Match the production distribution for native Lua/SQLite packages.
    container: ubuntu:26.04
    timeout-minutes: 15
    steps:
      - name: Install native runtime and test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates openssl nodejs npm python3 nginx libnginx-mod-http-lua lua5.1 lua-busted lua-cjson lua-lsqlite3 lua-filesystem luarocks liblua5.1-0-dev build-essential
          luarocks --lua-version=5.1 install lua-resty-dns 0.21-1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install browser test dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify syntax, security boundaries, storage and desktop/mobile flows
        run: bash scripts/check.sh
      - name: Check development dependency advisories
        run: npm audit --audit-level=high
